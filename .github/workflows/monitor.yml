name: dependency-monitor
on:
  schedule: [{cron: '7,37 * * * *'}]
  workflow_dispatch:
concurrency:
  group: dependency-monitor
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check for new dependency advisories
        env:
          APP_URL: ${{ vars.APP_URL }}
          MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}
        run: |
          test -n "$APP_URL" && test -n "$MONITOR_TOKEN"
          curl --fail-with-body --max-time 65 -X POST -H "Authorization: Bearer $MONITOR_TOKEN" "$APP_URL/api/monitor"
